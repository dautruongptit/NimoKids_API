spring:
  application:
    name: nimokids-api
  config:
    # Local secrets (DB_HOST, DB_PASSWORD, ...) live in an untracked .env file next to pom.xml.
    import: optional:file:./.env[.properties]
  profiles:
    default: dev

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only verifies it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 20
        order_inserts: true
        order_updates: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC
    default-property-inclusion: always

server:
  # Port standard: NimoKids is project 85, so the API is 8510 everywhere (IDE = container = host).
  port: ${SERVER_PORT:8510}
  shutdown: graceful

app:
  jwt:
    expiration-minutes: 60
  google:
    # Sign in with Google. Empty = switched off. Values come from the environment (never from the repository).
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  # Application log: console AND a rolling file. LOG_DIR defaults to ./logs (Docker sets /app/logs, a volume).
  # One file per day, split again at 20 MB, gzip-ed, kept 14 days, never more than 1 GB in total.
  file:
    name: ${LOG_DIR:logs}/nimokids-api.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_DIR:logs}/nimokids-api.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB

# Settings shared by every profile. Profile specifics: application-dev.yml (local) and application-prod.yml (Docker).
