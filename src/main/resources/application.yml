spring:
  application:
    name: nimokids-api
  config:
    # Local secrets (DB_HOST, DB_PASSWORD, ...) live in an untracked .env file next to pom.xml.
    import: optional:file:./.env[.properties]
  profiles:
    default: dev

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

# Common settings. Environment-specific values live in application-dev.yml
