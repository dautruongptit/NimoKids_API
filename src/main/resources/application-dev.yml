spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nimokids}
    username: ${DB_USER:nimokids}
    password: ${DB_PASSWORD:nimokids}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Schema is owned by Flyway; Hibernate only verifies it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    # db/seed holds DEVELOPMENT sample data (well-known passwords). Never add it to a non-dev profile.
    locations: classpath:db/migration,classpath:db/seed

  jackson:
    time-zone: UTC
    default-property-inclusion: always

# JWT is reserved for the future Admin portal. Player APIs are anonymous (X-Anonymous-Id).
# DEV ONLY secret (Base64, >= 256 bit). Override with JWT_SECRET outside local development.
app:
  jwt:
    secret: ${JWT_SECRET:bmltb2tpZHMtZGV2LW9ubHktand0LXNlY3JldC1rZXktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
    expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.nimokids: DEBUG
    org.hibernate.SQL: DEBUG
