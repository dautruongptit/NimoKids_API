# Local development. Activated by default (spring.profiles.default).
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nimokids}
    username: ${DB_USER:nimokids}
    password: ${DB_PASSWORD:nimokids}

  jpa:
    properties:
      hibernate:
        format_sql: true

  flyway:
    # db/seed holds DEVELOPMENT sample data (well-known passwords). Never add it to a non-dev profile.
    locations: classpath:db/migration,classpath:db/seed

# DEV ONLY secret (Base64, >= 256 bit). Override with JWT_SECRET outside local development.
app:
  jwt:
    secret: ${JWT_SECRET:bmltb2tpZHMtZGV2LW9ubHktand0LXNlY3JldC1rZXktZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9uLTAxMjM0NTY3ODk=}
  cors:
    # 8500 is the standard frontend port; 5173 / 3000 are the usual Vite / CRA defaults.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8500,http://localhost:5173,http://localhost:3000}

logging:
  level:
    root: INFO
    com.nimokids: DEBUG
    org.hibernate.SQL: DEBUG
